name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          out="asterism-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${out}" .
          tar -czf "${out}.tar.gz" "${out}"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: asterism-*.tar.gz
