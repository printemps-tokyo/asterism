name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The release is created once, before the matrix: jobs creating it at the
  # same moment used to collide, leaving one of them unable to upload.
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          out="asterism-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${out}" .
          tar -czf "${out}.tar.gz" "${out}"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: asterism-*.tar.gz
